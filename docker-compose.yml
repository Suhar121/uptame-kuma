services:
  uptame-kuma:
    build: .
    container_name: uptame-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persists SQLite database (kuma.db) and configuration on the host machine
      - ./data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
